[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealarr"
version = "0.2.0"
description = "Suivi de prix ciblé avec alertes (ntfy, ...) quand un article passe sous un seuil ou atteint un plus bas."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]  # httpx (déjà requis) sert de client de test FastAPI

[project.scripts]
dealarr = "dealarr.cli:main"

[tool.setuptools.packages.find]
include = ["dealarr*"]

[tool.setuptools.package-data]
"dealarr.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
