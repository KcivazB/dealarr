# CI dealarr : tests, puis image Docker poussée sur Harbor.
#
# Variables CI/CD à définir dans GitLab (Settings > CI/CD > Variables, "Masked" + "Protected") :
#   HARBOR_USERNAME  robot Harbor avec droit push sur le projet my-apps (ex. robot$my-apps+gitlab-ci)
#   HARBOR_PASSWORD  secret du robot
# Tags produits : <sha court> (toujours), latest (branche par défaut), vX.Y.Z (tag git).

variables:
  REGISTRY: harbor.virgilebaisnee.fr
  IMAGE: harbor.virgilebaisnee.fr/my-apps/dealarr

stages: [test, build]

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet ".[dev]"
    - pytest -q -W ignore::DeprecationWarning
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD" || (echo "HARBOR_USERNAME/HARBOR_PASSWORD manquants" && exit 1)
    - echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
  script:
    - docker build --pull -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest" && docker push "$IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG" && docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
    - docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$CI_COMMIT_SHORT_SHA" | tee digest.txt
  after_script:
    - docker logout "$REGISTRY" || true
  artifacts:
    paths: [digest.txt]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
